name: Update publications from Google Scholar

on:
  schedule:
    - cron: "0 13 1 * *" # 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest publications and mentoring stats
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          MENTEE_NAMES: ${{ secrets.MENTEE_NAMES }}
        run: python scripts/update_publications.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml _data/mentoring.yml
          git diff --cached --quiet || git commit -m "Update publications and mentoring stats from Google Scholar"
          git push
