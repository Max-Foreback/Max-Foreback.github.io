# Site settings
title       : "Max Foreback"
description : "Max Foreback is a PhD student at Michigan State University and lead software developer for the Nebulous collaboration with NASA JPL, using evolutionary computation to design spacecraft and antenna hardware."
url         : https://max-foreback.github.io
repository  : "Max-Foreback.github.io"

author:
  name          : "Max Foreback"
  first_name    : "Max"
  last_name     : "Foreback"
  avatar        : "/images/max-foreback.jpg"
  job_title     : "PhD Student"
  knows_about   : ["Evolutionary computation", "Evolutionary design", "Swarm robotics", "Artificial life", "Software engineering"]
  bio           : "PhD student · Lead Software Engineer, Nebulous Collaboration"
  location      : "East Lansing, MI, USA"
  employer      : "Michigan State University"
  email         : "foreba10@msu.edu"
  github        : "Max-Foreback"
  linkedin      : "max-foreback"
  googlescholar : "https://scholar.google.com/citations?user=AcTEViAAAAAJ&hl=en"

# Reading files
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - .claude
  # Collaborators page is off for now (nav link removed too) — content in
  # _pages/collaborators.md and _data/collaborators.yml is untouched, just
  # remove this line to bring the page back.
  - _pages/collaborators.md
  # Maintenance scripts and dependency files — not part of the site itself.
  - scripts
  - utils
  - Gemfile
  - Gemfile.lock

# Collections
collections:
  work:
    output: true
    permalink: /work/:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: work
    values:
      layout: work
  # Google Search Console verification file — must still be served as-is,
  # just not listed in sitemap.xml.
  - scope:
      path: "googleb6c0ceea58366914.html"
    values:
      sitemap: false

# Plugins (GitHub Pages safe list)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

permalink: /:title/
