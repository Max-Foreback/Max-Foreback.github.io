# Site settings
title       : "Max Foreback"
description : "Max Foreback — PhD student, Michigan State University"
url         : https://max-foreback.github.io
repository  : "Max-Foreback.github.io"

author:
  name          : "Max Foreback"
  bio           : "PhD student · Lead Software Engineer, Nebulous Collaboration"
  location      : "East Lansing, MI, USA"
  employer      : "Michigan State University"
  email         : "foreba10@msu.edu"
  github        : "Max-Foreback"
  linkedin      : "max-foreback"
  googlescholar : "https://scholar.google.com/citations?user=AcTEViAAAAAJ&hl=en"

# Reading files
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - .claude
  # Collaborators page is off for now (nav link removed too) — content in
  # _pages/collaborators.md and _data/collaborators.yml is untouched, just
  # remove this line to bring the page back.
  - _pages/collaborators.md

# Collections
collections:
  work:
    output: true
    permalink: /work/:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: work
    values:
      layout: work

# Plugins (GitHub Pages safe list)
plugins:
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

permalink: /:title/
